<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>NBA 数据站</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#17191c;--muted:#737983;--line:#e8eaee;--accent:#e85b24;--blue:#2463eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
header{background:#fff;padding:18px 16px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:var(--accent)}.sub{font-size:12px;color:var(--muted);margin-top:4px}
nav{display:flex;gap:8px;margin-top:14px;overflow:auto}nav button,.datebtn{border:0;background:#f0f1f4;border-radius:10px;padding:10px 14px;font-size:14px;white-space:nowrap;color:#333}nav button.active{background:#17191c;color:white}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}.toolbar{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 12px;gap:8px}.section-title{font-weight:750;font-size:17px}.small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px #10182805}
.gamehead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:12px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.team{display:flex;align-items:center;gap:9px;min-width:0}.team.away{flex-direction:row-reverse;text-align:right}.team img{width:34px;height:34px;object-fit:contain}.teamname{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.score{font-size:22px;font-weight:800}.vs{color:#a1a5ad;font-size:12px}.status{font-size:11px;color:var(--accent);font-weight:700;margin-top:4px;text-align:center}
.actions{display:flex;gap:8px;margin-top:12px}.actions button,.primary{background:#f1f3f6;border:0;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:650;color:#30343a}.actions button:first-child{background:#fff0e9;color:#b9471a}
.tablewrap{overflow:auto;border-radius:10px}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line)}th{background:#f8f9fb;color:var(--muted);font-weight:650}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff}th:first-child{background:#f8f9fb}.playername{font-weight:700}.teamtag{font-size:10px;color:var(--muted);margin-top:3px}
input,select{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;font:inherit;max-width:100%}.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow input{flex:1;min-width:0}
.loading,.empty,.error{padding:28px 10px;text-align:center;color:var(--muted);font-size:13px}.error{color:#b9471a}.hidden{display:none!important}
.standrow{display:grid;grid-template-columns:28px 1fr repeat(3,42px);gap:6px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13px}.standrow:last-child{border:0}.rank{color:var(--muted)}.standteam{display:flex;align-items:center;gap:8px;font-weight:650}.standteam img{width:25px;height:25px;object-fit:contain}.standhead{display:grid;grid-template-columns:28px 1fr repeat(3,42px);gap:6px;padding:8px 2px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}
footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:9px 12px calc(9px + env(safe-area-inset-bottom));text-align:center;font-size:10px;color:var(--muted)}
a{color:var(--blue)}.back{border:0;background:transparent;padding:0 0 12px;color:var(--blue);font-size:13px}
@media(min-width:600px){main{padding-top:20px}.teamname{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="brand">NBA <span>数据站</span></div>
  <div class="sub">赛程 · 实时比分 · 球员数据 · 排名</div>
  <nav>
    <button class="active" data-tab="games">比赛</button>
    <button data-tab="standings">排名</button>
    <button data-tab="players">球员查询</button>
  </nav>
</header>
<main>
<section id="games">
  <div class="toolbar"><div class="section-title">比赛赛程</div><input id="gameDate" type="date" style="width:150px;padding:8px;font-size:12px"></div>
  <div id="gamesList"><div class="loading">正在加载比赛…</div></div>
</section>
<section id="standings" class="hidden">
  <div class="toolbar"><div class="section-title">球队排名</div><select id="conference"><option value="east">东部</option><option value="west">西部</option></select></div>
  <div class="card"><div id="standingsList" class="loading">正在加载排名…</div></div>
</section>
<section id="players" class="hidden">
  <div class="toolbar"><div class="section-title">球员查询</div></div>
  <div class="card">
    <p style="margin-top:0;font-size:13px;color:var(--muted)">输入球员姓名，查询球员资料与近期比赛数据。</p>
    <div class="searchrow"><input id="playerSearch" placeholder="例如：Shai Gilgeous-Alexander"><button class="primary" id="searchBtn">搜索</button></div>
    <div id="playerResults"></div>
  </div>
</section>
<section id="detail" class="hidden">
  <button class="back" id="backBtn">← 返回比赛</button>
  <div id="detailContent"></div>
</section>
</main>
<footer>数据由 ESPN 公开接口提供 · 数据加载需要网络连接</footer>
<script>
const API='https://site.api.espn.com/apis/site/v2/sports/basketball/nba';
const $=id=>document.getElementById(id);
const dateFmt=d=>{let x=new Date(d);return x.toLocaleDateString('zh-CN',{month:'short',day:'numeric'})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function get(url){const r=await fetch(url);if(!r.ok)throw Error('网络请求失败');return r.json()}
function showError(el,msg='暂时无法加载数据，请稍后重试。'){el.innerHTML=`<div class="error">${esc(msg)}</div>`}
function teamLogo(team){return team?.logos?.[0]?.href||team?.logo||''}
function setTab(tab){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 ['games','standings','players','detail'].forEach(id=>$(id).classList.toggle('hidden',id!==tab));
 if(tab==='standings')loadStandings();if(tab==='games')loadGames();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function getToday(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
$('gameDate').value=getToday();
$('gameDate').onchange=loadGames;
async function loadGames(){
 const el=$('gamesList');el.innerHTML='<div class="loading">正在加载比赛…</div>';
 try{
  const date=$('gameDate').value.replaceAll('-','');
  const data=await get(`${API}/scoreboard?dates=${date}`);
  const events=data.events||[];
  if(!events.length){el.innerHTML='<div class="card empty">这一天没有找到比赛。可以切换日期查看。</div>';return}
  el.innerHTML=events.map(ev=>{
   const comp=ev.competitions?.[0], competitors=comp?.competitors||[];
   const away=competitors.find(t=>t.homeAway==='away')||competitors[0]||{},home=competitors.find(t=>t.homeAway==='home')||competitors[1]||{};
   const state=ev.status?.type?.shortDetail||ev.status?.type?.description||'';
   const completed=ev.status?.type?.completed;
   const score=(t)=>t.score??'—';
   return `<div class="card">
    <div class="gamehead"><span>${esc(ev.name||'NBA 比赛')}</span><span>${esc(state)}</span></div>
    <div class="teams">
     <div class="team"><img src="${esc(teamLogo(away.team))}" onerror="this.style.visibility='hidden'"><div><div class="teamname">${esc(away.team?.displayName||'客队')}</div><div class="small">${esc(away.records?.[0]?.summary||'')}</div></div></div>
     <div style="text-align:center"><div class="score">${esc(score(away))} <span class="vs">:</span> ${esc(score(home))}</div><div class="status">${completed?'已结束':esc(state)}</div></div>
     <div class="team away"><img src="${esc(teamLogo(home.team))}" onerror="this.style.visibility='hidden'"><div><div class="teamname">${esc(home.team?.displayName||'主队')}</div><div class="small">${esc(home.records?.[0]?.summary||'')}</div></div></div>
    </div>
    <div class="actions"><button onclick="loadGameDetail('${esc(ev.id)}','${esc(ev.name||'比赛详情')}')">查看球员数据 →</button></div>
   </div>`;
  }).join('');
 }catch(e){showError(el,'比赛数据加载失败。请检查网络后重试。')}
}
window.loadGameDetail=async function(id,title){
 ['games','standings','players'].forEach(s=>$(s).classList.add('hidden'));$('detail').classList.remove('hidden');
 $('detailContent').innerHTML=`<div class="loading">${esc(title)}<br><br>正在加载球员数据…</div>`;
 try{
  const d=await get(`${API}/summary?event=${id}`);
  const box=d.boxscore||{},players=box.players||[];
  let out=`<div class="section-title" style="margin-bottom:12px">${esc(title)}</div>`;
  if(!players.length){$('detailContent').innerHTML=out+'<div class="card empty">这场比赛暂时没有可用的球员统计数据（比赛未开始或数据源尚未更新）。</div>';return}
  for(const team of players){
   out+=`<div class="card"><div class="section-title" style="margin-bottom:12px">${esc(team.team?.displayName||'球队')}</div><div class="tablewrap"><table><thead><tr><th>球员</th><th>时间</th><th>得分</th><th>篮板</th><th>助攻</th><th>抢断</th><th>盖帽</th><th>失误</th><th>投篮</th><th>三分</th><th>罚球</th><th>正负值</th></tr></thead><tbody>`;
   for(const group of (team.statistics||[])){
    const labels=group.labels||[], athletes=group.athletes||[];
    for(const a of athletes){
     const stats=a.stats||[];
     const val=(...keys)=>{for(const k of keys){let i=labels.findIndex(x=>x.toLowerCase()===k.toLowerCase());if(i>=0)return stats[i]??'—'}return '—'};
     out+=`<tr><td><div class="playername">${esc(a.athlete?.displayName||'—')}</div><div class="teamtag">${esc(a.athlete?.position?.abbreviation||'')}</div></td><td>${esc(val('MIN'))}</td><td><b>${esc(val('PTS'))}</b></td><td>${esc(val('REB'))}</td><td>${esc(val('AST'))}</td><td>${esc(val('STL'))}</td><td>${esc(val('BLK'))}</td><td>${esc(val('TO'))}</td><td>${esc(val('FG'))}</td><td>${esc(val('3PT'))}</td><td>${esc(val('FT'))}</td><td>${esc(val('+/-'))}</td></tr>`;
    }
   }
   out+='</tbody></table></div></div>';
  }
  $('detailContent').innerHTML=out;
 }catch(e){showError($('detailContent'),'球员数据暂时加载失败。请稍后重试。')}
};
$('backBtn').onclick=()=>setTab('games');
async function loadStandings(){
 const el=$('standingsList');el.innerHTML='<div class="loading">正在加载排名…</div>';
 try{
  const d=await get(`${API}/standings?season=2027`);
  const children=d.children||d.standings?.children||[];
  const wanted=$('conference').value;
  let conf=children.find(c=>(c.name||c.abbreviation||'').toLowerCase().includes(wanted==='east'?'east':'west'));
  if(!conf&&children.length)conf=children[wanted==='east'?0:1];
  let entries=conf?.standings?.entries||[];
  if(!entries.length){
   const all=d.standings?.entries||[];
   entries=all.filter(e=>String(e.team?.groups?.name||e.team?.conference?.name||'').toLowerCase().includes(wanted));
  }
  if(!entries.length){el.innerHTML='<div class="empty">排名暂时不可用。新赛季数据可能尚未发布。</div>';return}
  const stat=(e,n)=>e.stats?.find(s=>s.name===n||s.abbreviation===n)?.displayValue??'—';
  el.innerHTML=`<div class="standhead"><span>#</span><span>球队</span><span>胜</span><span>负</span><span>胜率</span></div>`+entries.map((e,i)=>`<div class="standrow"><span class="rank">${i+1}</span><div class="standteam"><img src="${esc(teamLogo(e.team))}" onerror="this.style.visibility='hidden'"><span>${esc(e.team?.displayName||'')}</span></div><span>${esc(stat(e,'wins'))}</span><span>${esc(stat(e,'losses'))}</span><span>${esc(stat(e,'winPercent'))}</span></div>`).join('');
 }catch(e){showError(el,'排名加载失败，可能是数据源暂未开放新赛季排名。')}
}
$('conference').onchange=loadStandings;
$('searchBtn').onclick=searchPlayers;
$('playerSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlayers()});
async function searchPlayers(){
 const q=$('playerSearch').value.trim(),el=$('playerResults');
 if(!q){el.innerHTML='<div class="empty">请先输入球员姓名。</div>';return}
 el.innerHTML='<div class="loading">正在搜索…</div>';
 try{
  const d=await get(`https://site.web.api.espn.com/apis/common/v3/search?query=${encodeURIComponent(q)}&limit=10&type=player`);
  const items=d.results||d.items||d.athletes||[];
  if(!items.length){el.innerHTML='<div class="empty">没有找到结果。试试英文全名，例如 LeBron James。</div>';return}
  el.innerHTML=items.map(it=>{const a=it.athlete||it;const name=a.displayName||a.name||it.displayName||it.name||'球员';const team=a.team?.displayName||a.teamName||'';const img=a.headshot?.href||a.links?.[0]?.href||'';return `<div class="card" style="display:flex;align-items:center;gap:12px;margin:8px 0"><img src="${esc(img)}" style="width:48px;height:48px;object-fit:contain;border-radius:50%" onerror="this.style.visibility='hidden'"><div><div class="playername">${esc(name)}</div><div class="small">${esc(team)}</div></div></div>`}).join('');
 }catch(e){showError(el,'球员搜索接口暂时不可用。')}
}
loadGames();
</script>
</body>
</html>
